name: Deploy to GitHub Pages
# Site = public/ (live app, /logbook/) + beta/ (test app, /logbook/beta/). Both are committed build outputs:
#   node scripts/build.mjs beta   → rebuild the test app
#   node scripts/build.mjs live   → promote the current source to the live app
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npx --yes -p typescript@7.0.2 tsc -p . --noEmit
      - run: node --test tests/*.test.mjs
      - name: Assemble site
        run: |
          mkdir -p _site && cp -r public/. _site/ && mkdir -p _site/beta && cp -r beta/. _site/beta/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
