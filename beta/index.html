<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1012" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- "default": the app starts below the status bar, so iOS 26 draws no blurred edge over it -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="JimLogs β">
<meta name="description" content="Personal workout log and progression tracker">
<title>JimLogs β</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<!-- iOS 26 draws its "scroll edge" blur over the top of Home Screen web apps unless it finds a fixed,
     full-width, opaque, hit-testable box at the top edge to take a colour from. This strip is that box. -->
<div id="topedge" aria-hidden="true"></div>
<div id="app"><div class="scroll"><p class="sub">Loading…</p></div></div>
<noscript>JimLogs needs JavaScript.</noscript>
<script type="module" src="./js/app.js"></script>
</body>
</html>
